[package]
name = "cordond"
version = "0.2.0"
edition = "2021"
rust-version = "1.90"
license = "AGPL-3.0-only"
description = "Per-owner workspace isolation for AI agent runtimes"
repository = "https://github.com/fajarhide/cordon"

[[bin]]
name = "cordon"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "time", "fs", "io-util", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"
libc = "0.2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
# a WebSocket client for the /v1/stdio tests, the same tungstenite axum's ws feature uses
tokio-tungstenite = "0.29"
futures-util = "0.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
# panic stays unwind on purpose: a panic in one handler must not take the
# daemon down, or one malformed request becomes a denial of service.
