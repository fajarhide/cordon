name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install the Rust toolchain
        run: rustup component add clippy rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # The runner has docker, so the two container tests that skip on a laptop
      # actually run here. Pulling the image up front keeps the 20s test
      # timeout from being spent on a pull.
      # Pulled up front so a cold pull does not eat a job's wall clock budget.
      - name: Pull the sandbox image
        run: docker pull alpine:3.20

      # CORDON_REQUIRE_DOCKER turns a skipped container test into a failure, so
      # coverage cannot quietly lapse on a runner that has a runtime. It was
      # reported as being here once before and was not: a scripted edit failed
      # silently and nobody checked the file.
      - name: Test
        run: cargo test -- --nocapture
        env:
          CORDON_REQUIRE_DOCKER: "1"

      # podman is a documented runtime now rather than a hopeful alias, so it
      # gets its own run. It broke once already: cordon called docker
      # unconditionally, and the old egress allowlist's host-gateway pin failed
      # the container outright under rootless podman with netavark.
      - name: Install podman
        run: sudo apt-get update -qq && sudo apt-get install -y -qq podman

      - name: Container tests against podman
        run: cargo test --bin cordon exec::container -- --nocapture
        env:
          CORDON_CONTAINER_CLI: podman
          CORDON_REQUIRE_DOCKER: "1"

  guarantee:
    name: The guarantee, end to end
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Build the release binary
        run: cargo build --release

      - name: Size and dependency count
        run: |
          ls -l target/release/cordon | awk '{printf "binary: %.1f MB\n", $5/1048576}'
          cargo tree --depth 1 --edges normal | tail -n +2 | wc -l | xargs echo "direct dependencies:"

      # No daemon, no docker, no configuration. If this fails the product does
      # not work, so it runs before anything else is set up.
      - name: cordon demo
        run: ./target/release/cordon demo

      - name: Start the daemon
        run: |
          mkdir -p /tmp/cordon-ci
          CORDON_ROOT=/tmp/cordon-ci CORDON_LISTEN=tcp:127.0.0.1:7777 \
            CORDON_TOKEN=ci-token ./target/release/cordon serve &
          for _ in $(seq 40); do
            curl -sf http://127.0.0.1:7777/v1/health >/dev/null && break
            sleep 0.25
          done
          curl -sf http://127.0.0.1:7777/v1/health

      # With a token, so the auth checks run rather than skip, and on Linux,
      # so the data plane checks run rather than skip. Both are the point.
      - name: cordon verify
        run: ./target/release/cordon verify http://127.0.0.1:7777 ci-token

      # A second daemon, configured for the container backend, so the backend
      # floor check runs instead of skipping. It is the one check the
      # process-configured daemon above cannot exercise.
      - name: cordon verify against a container-configured daemon
        run: |
          mkdir -p /tmp/cordon-ci-ctr
          CORDON_ROOT=/tmp/cordon-ci-ctr CORDON_LISTEN=tcp:127.0.0.1:7778 \
            CORDON_TOKEN=ci-token CORDON_BACKEND=container \
            ./target/release/cordon serve &
          for _ in $(seq 40); do
            curl -sf http://127.0.0.1:7778/v1/health >/dev/null && break
            sleep 0.25
          done
          ./target/release/cordon verify http://127.0.0.1:7778 ci-token | tee /tmp/ctr.txt
          grep -q "ok   a weaker backend is refused" /tmp/ctr.txt || {
            echo "the backend floor check did not run on a container-configured daemon"
            exit 1; }

      # A run with no credentials must not report success: every check skips,
      # nothing passes, and the exit code has to say so.
      - name: cordon verify refuses to pass without credentials
        run: |
          if ./target/release/cordon verify http://127.0.0.1:7777 > /tmp/noauth.txt 2>&1; then
            echo "verify exited 0 with no credentials:"
            cat /tmp/noauth.txt
            exit 1
          fi
          grep -q "Nothing was actually tested" /tmp/noauth.txt
          echo "an all-skip run exits non-zero, as it should"

      - name: A job writes a file and gets a token back
        run: |
          set -euo pipefail
          resp=$(curl -sS -X POST http://127.0.0.1:7777/v1/run \
            -H 'content-type: application/json' -H 'Authorization: Bearer ci-token' -d '{
              "owner":["acme","budi"],"entrypoint":"sh",
              "args":["-c","mkdir -p out; printf hello > out/r.txt; echo done"],
              "collect":["out/*"],
              "limits":{"wall_ms":5000,"memory_mb":128,"stdout_kb":64}}')
          echo "$resp"
          token=$(echo "$resp" | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
          test -n "$token" || { echo "no token minted"; exit 1; }

          body=$(curl -sS -H 'Authorization: Bearer ci-token' "http://127.0.0.1:7777/v1/artifact/$token?owner=acme/budi")
          test "$body" = "hello" || { echo "artifact body was $body"; exit 1; }

          # The same token, a different owner. Must be refused, and must look
          # identical to a token that never existed.
          wrong=$(curl -sS -H 'Authorization: Bearer ci-token' "http://127.0.0.1:7777/v1/artifact/$token?owner=acme/ani")
          fake=$(curl -sS -H 'Authorization: Bearer ci-token' "http://127.0.0.1:7777/v1/artifact/art_ffffffffffffffffffffffffffffffff?owner=acme/ani")
          bare=$(curl -sS -H 'Authorization: Bearer ci-token' "http://127.0.0.1:7777/v1/artifact/$token")
          test "$bare" = "$fake" || {
            echo "a fetch with no owner is distinguishable from an unknown token"
            echo "bare: $bare"; echo "fake: $fake"; exit 1; }
          test "$wrong" = "$fake" || {
            echo "a wrong-owner refusal is distinguishable from an unknown token"
            echo "wrong: $wrong"; echo "fake:  $fake"; exit 1; }
          echo "wrong owner refused, indistinguishable from an unknown token"

      - name: A container job runs with no network
        run: |
          set -euo pipefail
          docker pull -q alpine:3.20
          resp=$(curl -sS -X POST http://127.0.0.1:7777/v1/run \
            -H 'content-type: application/json' -H 'Authorization: Bearer ci-token' -d '{
              "owner":["acme","budi"],"entrypoint":"sh","backend":"container",
              "args":["-c","wget -q -T 3 -O - https://example.com || echo BLOCKED"],
              "limits":{"wall_ms":30000,"memory_mb":128,"stdout_kb":64}}')
          echo "$resp"
          echo "$resp" | grep -q BLOCKED || {
            echo "the container reached the network"; exit 1; }
          echo "container job ran and had no network"

      - name: Footprint while serving
        run: |
          rss=$(ps -o rss= -p "$(pgrep -f 'cordon serve' | head -1)" | tr -d ' ')
          echo "daemon RSS while serving: ${rss} KB"
          test "$rss" -lt 20480 || { echo "over the 20 MB budget"; exit 1; }

  client:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun test
        working-directory: clients/typescript

  prose:
    name: No em dashes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Grep every tracked file
        run: |
          if git grep -nP '\x{2014}|\x{2013}' -- . ; then
            echo "An em dash or en dash reached a tracked file."
            exit 1
          fi
          echo "clean"
